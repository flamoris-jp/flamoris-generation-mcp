[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flamoris-generation-mcp"
version = "0.1.0"
description = "Small MCP server for template-based media generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
flamoris-generation-mcp = "flamoris_generation_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flamoris_generation_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
