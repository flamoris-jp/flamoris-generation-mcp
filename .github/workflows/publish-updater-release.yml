name: Publish repository-owned Updater release
on:
  pull_request:
    paths: ['.github/workflows/publish-updater-release.yml', 'release/**', 'scripts/*updater*.py', 'pyproject.toml', 'Dockerfile']
  push:
    branches: [main]
    paths: ['.github/workflows/publish-updater-release.yml', 'release/**', 'scripts/*updater*.py', 'pyproject.toml', 'Dockerfile']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build this repository's immutable Docker image
        run: |
          docker build --platform '${{ matrix.platform }}' --tag 'repository-release:1.0.9' .
          docker run --rm --entrypoint python 'repository-release:1.0.9' -c 'import importlib.metadata as m; assert m.version("flamoris-generation-mcp") == "1.0.9"; assert m.version("flamoris-generation-controller") == "1.0.6"'
          docker run --rm --entrypoint python 'repository-release:1.0.9' -m pip check
          mkdir -p dist
          docker image save --output dist/image.tar 'repository-release:1.0.9'
          image_id=$(docker image inspect --format '{{.Id}}' 'repository-release:1.0.9')
          python scripts/package_updater_release.py --platform '${{ matrix.platform }}' --revision "$GITHUB_SHA" --image dist/image.tar --image-id "$image_id" --output dist/release
      - name: Install and start this release with the actual Updater
        run: |
          python -m pip install 'https://github.com/flamoris-jp/flamoris-updater/archive/adb7fb2843dbb34b840e1cb1ad2b8c1a0234c8b9.zip'
          sudo env GITHUB_ACTIONS=true FLAMORIS_INSTALL_TEST_POSTGRES_DSN="${FLAMORIS_INSTALL_TEST_POSTGRES_DSN:-}" "$(command -v python)" scripts/verify_updater_catalog.py dist/release/catalog-linux-${{ matrix.arch }}.json --install
      - name: Update the published predecessor while retaining settings and data
        run: |
          mkdir -p dist/upgrade-check
          curl --fail --location --max-time 60 --output dist/upgrade-check/previous.json 'https://github.com/flamoris-jp/flamoris-generation-mcp/releases/download/v1.0.8/catalog-linux-${{ matrix.arch }}.json'
          sudo env GITHUB_ACTIONS=true "$(command -v python)" scripts/verify_updater_catalog.py dist/release/catalog-linux-${{ matrix.arch }}.json --upgrade-from-catalog dist/upgrade-check/previous.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-release-${{ matrix.arch }}
          path: dist/release/
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: repository-release-*
          path: candidates/
      - run: python scripts/package_updater_release.py --combine candidates --output distribution
      - name: Publish this repository's immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api 'repos/'"$GITHUB_REPOSITORY"'/git/ref/tags/v1.0.9' > /dev/null 2>&1; then
            echo 'Release tag already exists; refusing to replace it'
            exit 1
          fi
          gh release create v1.0.9 distribution/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'flamoris-generation-mcp v1.0.9' --notes-file release/NOTES.md --latest

