name: Temporary source verification
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,http]'
      - run: ruff check --fix .
        continue-on-error: true
      - run: ruff format .
      - name: Formatter patch
        run: python -c "import subprocess; print('CODEX_FORMAT_DIFF_BEGIN'); print(subprocess.check_output(['git','diff'],text=True)); print('CODEX_FORMAT_DIFF_END')"
      - run: ruff check .
        continue-on-error: true
      - run: pytest

      - name: Export facade catalog
        run: |
          python - <<'PY'
          import asyncio, json
          from mcp import Client
          from flamoris_generation_mcp.server import create_server
          async def main():
              async with Client(create_server()) as client:
                  tools = (await client.list_tools()).tools
                  values = {t.name: {"input_schema": t.input_schema, "annotations": t.annotations.model_dump(exclude_none=True)} for t in tools}
                  print("CODEX_CATALOG_BEGIN")
                  print(json.dumps(values))
                  print("CODEX_CATALOG_END")
          asyncio.run(main())
          PY

